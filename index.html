<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Warszawa Transport</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>
<body>

<div id="map"></div>

<script>
const map = L.map('map').setView([52.2297, 21.0122], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

const GTFS_URL = "https://cdn.zbiorkom.live/gtfs/warsaw.zip";

// 🔥 Prosty parser CSV
function parseCSV(text) {
    const lines = text.split("\n");
    const headers = lines[0].split(",");
    return lines.slice(1).map(line => {
        const values = line.split(",");
        let obj = {};
        headers.forEach((h,i)=> obj[h] = values[i]);
        return obj;
    });
}

fetch(GTFS_URL)
.then(r => r.arrayBuffer())
.then(data => JSZip.loadAsync(data))
.then(zip => Promise.all([
    zip.file("stops.txt").async("string"),
    zip.file("stop_times.txt").async("string")
]))
.then(([stopsText, stopTimesText]) => {

    const stops = parseCSV(stopsText);
    const stopTimes = parseCSV(stopTimesText);

    // 🔥 indeks odjazdów
    const stopIndex = {};
    stopTimes.forEach(st => {
        if (!stopIndex[st.stop_id]) stopIndex[st.stop_id] = [];
        stopIndex[st.stop_id].push(st.departure_time);
    });

    stops.forEach(stop => {

        if (!stop.stop_lat || !stop.stop_lon) return;

        const marker = L.circleMarker(
            [parseFloat(stop.stop_lat), parseFloat(stop.stop_lon)],
            {
                radius: 7,
                fillColor: "#00ff66",
                color: "#006633",
                weight: 1,
                fillOpacity: 0.9
            }
        ).addTo(map);

        marker.on("click", function() {

            const departures = stopIndex[stop.stop_id];

            let html = `<b>${stop.stop_name}</b><br><br>`;

            if (!departures) {
                html += "Brak odjazdów";
            } else {
                departures
                    .sort()
                    .slice(0, 15)
                    .forEach(time => {
                        html += `🚌 ${time}<br>`;
                    });
            }

            marker.bindPopup(html).openPopup();
        });

    });

})
.catch(err => {
    console.error("Błąd:", err);
    alert("Błąd ładowania GTFS – sprawdź konsolę.");
});
</script>

</body>
</html>
